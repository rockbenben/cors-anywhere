name: 🐳 Build and Push Docker Image

on:
  workflow_dispatch:
  release:
    types: [published]

# Never cancel an in-flight publish for the same ref — releases must complete
# atomically, even if another dispatch lands while one is running.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

# Least-privilege: only what's needed to checkout and push to GHCR.
# Docker Hub auth uses a separate PAT, not GITHUB_TOKEN.
permissions:
  contents: read
  packages: write

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Check out the repo
        uses: actions/checkout@v6

      - name: Extract version from package.json
        id: get_version
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🔑 Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ vars.DOCKERHUB_USERNAME }}/cors-anywhere
            ghcr.io/${{ github.repository_owner }}/cors-anywhere
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest

      # Build and push Docker image to both Docker Hub and GHCR
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Attach SLSA build provenance and SBOM to the published image.
          # Downstream consumers can inspect with `docker buildx imagetools inspect`.
          provenance: mode=max
          sbom: true
